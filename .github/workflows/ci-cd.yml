name: CI/CD

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r requirements.txt && python test_app.py
        working-directory: api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: node src/lib/financiamento.check.ts
      - run: npm run build

  deploy:
    if: github.event_name == 'push'
    needs: [api, web]
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Deploy na VPS
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 600 /dev/null ~/key && echo "$SSH_KEY" > ~/key
          ssh -i ~/key -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && git pull --ff-only && docker compose up -d --build --remove-orphans && docker image prune -f"
