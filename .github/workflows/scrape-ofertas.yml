name: Atualizar ofertas

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 09:00 UTC (06:00 em Fortaleza)
  workflow_dispatch: {}

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scrape-ofertas.mjs
      - name: Commit se houver mudança
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/ofertas.json
          git diff --staged --quiet || git commit -m "chore: atualizar ofertas do Chaves na Mão"
          git push
