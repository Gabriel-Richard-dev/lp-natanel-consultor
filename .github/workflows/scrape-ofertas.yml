name: Resincronizar ofertas do Chaves na Mão

on:
  schedule:
    - cron: "0 9 * * *" # todo dia às 09:00 UTC (06:00 em Fortaleza)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de sincronismo da API
        run: |
          curl -f -X POST "${{ secrets.API_URL }}/sync/chaves-na-mao" \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}"
