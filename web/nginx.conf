# IP real do visitante: o último do X-Forwarded-For (posto pelo Caddy da VPS).
# Os anteriores vêm do cliente e podem ser forjados para burlar o rate limit.
map $http_x_forwarded_for $ip_cliente {
    "~(?<ultimo>[^,\s]+)\s*$" $ultimo;
    default $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API e fotos na mesma origem do site: uma porta só, sem CORS
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $ip_cliente;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_cookie_path /auth /api/auth;
        client_max_body_size 6m;
    }

    location /fotos/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $proxy_host;
        expires 30d;
    }
}
