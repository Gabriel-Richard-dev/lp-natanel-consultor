services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: natanael
      POSTGRES_PASSWORD: ${DB_PASSWORD:-natanael}
      POSTGRES_DB: imoveis
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "natanael", "-d", "imoveis"]
      interval: 2s
      retries: 30

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?defina S3_ACCESS_KEY no .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?defina S3_SECRET_KEY no .env}
    volumes:
      - s3_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000" # fotos públicas
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # console, só na própria máquina

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://natanael@db:5432/imoveis
      PGPASSWORD: ${DB_PASSWORD:-natanael} # fora da URL: senha com @ : / quebraria o parse
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (32+ caracteres)}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      MINIO_BUCKET: imoveis
      MINIO_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/imoveis}
      CHAVES_NA_MAO_URL: https://www.chavesnamao.com.br/corretor/natanael-machado/id-616202/
    ports:
      - "${API_PORT:-3001}:3001"

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
  s3_data:
